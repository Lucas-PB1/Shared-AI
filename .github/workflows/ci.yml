name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão do shellcheck
        run: shellcheck --version
      - name: Lint dos scripts shell
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf 'Analisando %d script(s)\n' "${#files[@]}"
          shellcheck -x --severity=error "${files[@]}"

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Rodar testes
        run: npm test
