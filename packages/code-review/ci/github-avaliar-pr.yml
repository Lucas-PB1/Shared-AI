# /avaliar automático no GitHub — Fase 2: estático + LLM + comentários por arquivo.
# Copiar para .github/workflows/avaliar-pr.yml no projeto alvo.
# Documentação: packages/code-review/ci/README.md

name: Avaliar PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR (obrigatório no dispatch manual)"
        required: true
        type: string
      mode:
        description: "Modo: both (estático+LLM), static, llm"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - static
          - llm

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: avaliar-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  HOSTDIME_IA_REPO: https://github.com/HostDimeBR/hostdime-ia.git
  HOSTDIME_IA_REF: main
  REVIEW_AVALIAR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
  REVIEW_AVALIAR_SOFT: "true"
  REVIEW_LLM_PROVIDER: cursor
  HOSTDIME_REVIEW_WORKDIR: ${{ runner.temp }}/hostdime-review

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolver número do PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            base="$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json baseRefOid -q .baseRefOid)"
            head="$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
            echo "head=${head}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.pr.outputs.head }}
          fetch-depth: 0

      - name: Cache Cursor CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cursor-cache
        with:
          path: ~/.cursor
          key: cursor-cli-${{ runner.os }}-v1

      - name: Instalar Cursor CLI
        run: |
          if [[ -x "$HOME/.cursor/bin/agent" ]]; then
            echo "Cursor CLI (cache hit)"
          else
            curl https://cursor.com/install -fsS | bash
          fi
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          "$HOME/.cursor/bin/agent" --version || agent --version

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Checkout hostdime-ia (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HostDimeBR/hostdime-ia
          ref: ${{ env.HOSTDIME_IA_REF }}
          path: hostdime-ia
          token: ${{ secrets.HOSTDIME_IA_TOKEN || github.token }}
          sparse-checkout: |
            packages/code-review
            package.json
            composer.json
          sparse-checkout-cone-mode: false

      - name: Cache pip (semgrep)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-v1

      - name: Cache deps hostdime-ia
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ia-deps
        with:
          path: |
            hostdime-ia/node_modules
            hostdime-ia/vendor
          key: ia-review-${{ hashFiles('hostdime-ia/package.json', 'hostdime-ia/composer.json') }}
          restore-keys: |
            ia-review-

      - name: Instalar deps de review
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-xml composer python3-pip
          pip install --break-system-packages semgrep pyyaml 2>/dev/null || pip install semgrep pyyaml
          cd hostdime-ia
          if [[ "${{ steps.ia-deps.outputs.cache-hit }}" != "true" ]]; then
            # hostdime-ia não versiona package-lock.json / composer.lock (.gitignore)
            npm install --no-fund --no-audit --ignore-scripts
            composer install --no-interaction --quiet --no-ansi
          else
            echo "hostdime-ia deps (cache hit)"
          fi
          test -x node_modules/.bin/eslint
          test -x vendor/bin/phpstan
          echo "HOSTDIME_IA_ROOT=${{ github.workspace }}/hostdime-ia" >> "$GITHUB_ENV"

      - name: Instalar deps do projeto
        run: npm ci

      - name: Pull memory from store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVIEW_PROJECT_SLUG: ${{ vars.REVIEW_PROJECT_SLUG || github.event.repository.name }}
        run: |
          bash "$HOSTDIME_IA_ROOT/packages/code-review/tools/sh/review-memory-pull.sh" \
            --project "${{ github.workspace }}"

      - name: /avaliar — estático + LLM + comentários no PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_DIFF_BASE: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          CI_COMMIT_SHA: ${{ steps.pr.outputs.head }}
          CURSOR_PROJECT_DIR: ${{ github.workspace }}
          REVIEW_AVALIAR_SOFT: "true"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL || 'composer-2.5' }}
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVIEW_PROJECT_SLUG: ${{ vars.REVIEW_PROJECT_SLUG || github.event.repository.name }}
        run: bash "$HOSTDIME_IA_ROOT/packages/code-review/tools/sh/review-github-pr.sh"

      # Store (runs/findings/decisions): só após merge — ver github-avaliar-pr-memoria.yml
      # Artefatos efêmeros no artifact; sem publish no open PR.

      - name: Upload relatórios CI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avaliar-reports-pr-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/hostdime-review/reports/
          if-no-files-found: ignore
