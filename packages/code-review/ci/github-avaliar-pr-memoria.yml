name: Avaliar PR — memória

# Após merge: aprende com threads do /avaliar (aceito vs ignorado) → convencoes + exclusions.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número do PR mergeado (retry manual do ingest)
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest-memoria:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Checkout hostdime-ia (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HostDimeBR/hostdime-ia
          ref: main
          path: hostdime-ia
          token: ${{ secrets.HOSTDIME_IA_TOKEN || github.token }}
          sparse-checkout: |
            packages/code-review
          sparse-checkout-cone-mode: false

      - name: Instalar deps
        run: pip install pyyaml

      - name: Ingerir decisões do PR mergeado
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HOSTDIME_IA_ROOT: ${{ github.workspace }}/hostdime-ia
        run: |
          bash "$HOSTDIME_IA_ROOT/packages/code-review/tools/review-ingest-pr-decisions.sh" --write .

      - name: Abrir PR com memória versionada
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor/review/convencoes.md .cursor/review/exclusions.yaml || true
          if git diff --staged --quiet; then
            echo "Sem alterações em convencoes/exclusions."
            exit 0
          fi
          BRANCH="chore/review-memoria-pr-${PR_NUM}"
          git checkout -b "$BRANCH"
          git commit -m "chore(review): memória pós-merge PR #${PR_NUM}"
          git push -u origin "$BRANCH" --force
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)"
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING já aberto para $BRANCH."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(review): memória pós-merge PR #${PR_NUM}" \
            --body "Ingest automático do /avaliar após merge do PR #${PR_NUM}."
