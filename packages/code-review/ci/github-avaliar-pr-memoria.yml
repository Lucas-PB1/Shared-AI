name: Avaliar PR — memória

# Após merge: aprende com threads do /avaliar → store
# (decisions + exclusions + promoção LLM de conventions).
# Com CURSOR_API_KEY o promote chama o binário `agent` — instalar Cursor CLI abaixo.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número do PR mergeado (retry manual do ingest)
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  ingest-memoria:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOSTDIME_REVIEW_WORKDIR: ${{ runner.temp }}/hostdime-review
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Cache Cursor CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cursor-cache
        with:
          path: ~/.cursor
          key: cursor-cli-${{ runner.os }}-v1

      - name: Instalar Cursor CLI
        run: |
          if [[ -x "$HOME/.cursor/bin/agent" ]]; then
            echo "Cursor CLI (cache hit)"
          else
            curl https://cursor.com/install -fsS | bash
          fi
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          "$HOME/.cursor/bin/agent" --version || agent --version

      - name: Checkout hostdime-ia (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HostDimeBR/hostdime-ia
          ref: main
          path: hostdime-ia
          token: ${{ secrets.HOSTDIME_IA_TOKEN || github.token }}
          sparse-checkout: |
            packages/code-review
          sparse-checkout-cone-mode: false

      - name: Instalar deps hostdime-ia
        run: |
          cd hostdime-ia
          npm install --no-fund --no-audit --ignore-scripts
          echo "HOSTDIME_IA_ROOT=${{ github.workspace }}/hostdime-ia" >> "$GITHUB_ENV"

      - name: Ingerir decisões do PR → store
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HOSTDIME_IA_ROOT: ${{ github.workspace }}/hostdime-ia
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVIEW_PROJECT_SLUG: ${{ vars.REVIEW_PROJECT_SLUG || github.event.repository.name }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          REVIEW_LLM_PROVIDER: ${{ vars.REVIEW_LLM_PROVIDER }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL }}
          REVIEW_CONVENTION_LLM: ${{ vars.REVIEW_CONVENTION_LLM }}
        run: |
          bash "$HOSTDIME_IA_ROOT/packages/code-review/tools/sh/review-ingest-pr-decisions.sh" --write .
