# Review estático em merge requests — mesmas ferramentas do /avaliar (review-check.sh).
# Incluir: packages/code-review/ci/README.md

variables:
  HOSTDIME_IA_REPO: "https://github.com/hostdime/hostdime-ia.git"
  HOSTDIME_IA_REF: "main"

.hostdime-review-base:
  image: node:20-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git php-cli php-xml composer python3-pip
    - pip install --break-system-packages semgrep 2>/dev/null || pip install semgrep
    - |
      if [[ -z "${HOSTDIME_IA_ROOT:-}" ]]; then
        export HOSTDIME_IA_ROOT="/tmp/hostdime-ia"
        git clone --depth 1 --branch "$HOSTDIME_IA_REF" "$HOSTDIME_IA_REPO" "$HOSTDIME_IA_ROOT"
      fi
    - cd "$HOSTDIME_IA_ROOT" && npm ci && composer install --no-interaction --quiet
  script:
    - cd "$CI_PROJECT_DIR"
    - export CURSOR_PROJECT_DIR="$CI_PROJECT_DIR"
    - bash "$HOSTDIME_IA_ROOT/packages/code-review/tools/review-ci.sh"

hostdime-review:
  extends: .hostdime-review-base
  stage: test
